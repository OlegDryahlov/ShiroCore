# # Информация о модуле
[module]

# * Название модуля
# Название модуля должно быть подходящим для переменной Python, так как будет
# использовано при его импорте: 
# ? from example_module.handler import Handler as ExampleModule
# 
# Сделано для того, чтобы была возможность использовать модуль из других
# модулей.
# 
# Если название модуля не будет указано, будет использовано имя директории
# модуля в виде Module_[имя директории]:
# ? from example_module.handler import Handler as Module_example_module
name = "ExampleModule"

# * Тип модуля
# Тип "module" указывает на то, что модуль будет использоваться из меню
# приложения (модуля типа "menu").
type = "module"

# * Версия приложения
# В данный момент неиспользуемый параметр. Будет использоваться при проверке
# зависимостей.
version = "1.0.0"


[schema]

# * Версия схемы
# Сделано с расчётом на будущие обновления, в которых построение файла
# "module.toml" может измениться. Для поддержки обратной совместимости
# приложение будет уметь читать схемы разных версий и при необходимости
# заполнять отсутствующие значения значениями по умолчанию.
# 
# Тем не менее, пока приложение находится в разработке первой версии, схема
# может меняться и дополняться.
version = 1
