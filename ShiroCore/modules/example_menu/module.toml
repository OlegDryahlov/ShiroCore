# # Информация о модуле
[module]

name = "ExampleMenu"

# * Тип модуля
# Тип "menu" указывает, что модуль представляет собой управляющее меню
# из которого будут вызываться остальные модули. Модуль данного типа будет
# обработан при запуске иначе, чем обычный модуль типа "module".
# 
# ! Модуль типа "menu" может быть только один.
# В случае, если установлено несколько модулей типа "menu", будет загружен
# последний по алфавиту. (Будет исправлено в будущих обновлениях, приоритетное
# меню можно будет указать в конфигурации приложения)
type = "menu"

# * Версия приложения
# В данный момент неиспользуемый параметр. Будет использоваться при проверке
# зависимостей.
version = "1.0.0"


[schema]

# * Версия схемы
# Сделано с расчётом на будущие обновления, в которых построение файла
# "module.toml" может измениться. Для поддержки обратной совместимости
# приложение будет уметь читать схемы разных версий и при необходимости
# заполнять отсутствующие значения значениями по умолчанию.
# 
# Тем не менее, пока приложение находится в разработке первой версии, схема
# может меняться и дополняться.
version = 1
