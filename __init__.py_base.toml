# # Текст автоматически генерируемого файла "modules.__init__.py"
file = """# -*- coding: utf-8 -*-
# Автоматически генерируемый файл на основе дата-файлов модулей
#
# Не вносите изменения в этот файл!
# Все изменения будут сброшены после перезапуска приложения

# Главное меню приложения
{import_menu}

# Модули приложения
{import_modules}


# Класс меню, вызываемый при запуске приложения после настройки
menu: MainMenu = MainMenu(
    modules=[
        {modules_names}
    ]
)
"""

# # Строки-шаблоны для импорта модулей
[import]

# * Строка-шаблон импорта для меню приложения
# ? [dir_] - имя директории модуля
# Так как модуль-меню может быть только один - используем заранее обозначенное
# имя - MainMenu
menu = "from .{dir_}.handler import Handler as MainMenu"

# * Строка-шаблон импорта для модуля
# ? [dir_] - имя директории модуля
# ? [name] - имя модуля, взятое из дата-файла "module.toml"
# ?     В случае, если имя не указано, будет использовано значение
# ?     по умолчанию - "Module_{dir_}".
module = "from .{dir_}.handler import Handler as {name}"
